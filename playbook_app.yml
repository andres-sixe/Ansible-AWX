---
- name: Instalar Capa de Aplicación
  hosts: all
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: 🛑 Filtrado de Seguridad - Expulsar hosts que no son APP
      meta: end_host
      when: "'app' not in inventory_hostname"

  tasks:
    - name: Instalar PHP y dependencias comunes
      dnf:
        name: 
          - php
          - php-cli
          - php-mysqlnd
          - python3-pip
        state: present

    - name: Crear directorio de configuración de la App
      file:
        path: /etc/myapp
        state: directory
        mode: '0755'

    - name: Desplegar archivo de configuración dummy
      copy:
        dest: /etc/myapp/config.ini
        content: |
          [database]
          host=hugo-db-01
          user=admin_app
          password=secret
        mode: '0644'
