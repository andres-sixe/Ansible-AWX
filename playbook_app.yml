---
- name: Instalar Capa de Aplicación
  hosts: webservers
  become: yes
  tasks:
    - name: Instalar PHP y dependencias
      dnf:
        name: 
          - php
          - php-cli
          - php-mysqlnd
        state: present

    - name: Crear archivo de configuración de App
      copy:
        dest: /etc/myapp_config.ini
        content: |
          [database]
          host=db-server
          user=admin
