---
- name: Instalar Capa de Aplicación
  hosts: all
  become: yes

  pre_tasks:
    - name: 🛡️ GUARDRAIL - Verificar que este host es de Aplicación
      ansible.builtin.assert:
        that:
          - "'app' in inventory_hostname"
        fail_msg: "❌ ERROR CRÍTICO: Se intentó ejecutar el playbook de APP en '{{ inventory_hostname }}'. Deteniendo ejecución."
        success_msg: "✅ Verificación exitosa: '{{ inventory_hostname }}' es un servidor de aplicación."

  tasks:
    - name: Instalar PHP y dependencias
      dnf:
        name: 
          - php
          - php-cli
          - php-mysqlnd
        state: present

    - name: Crear config dummy
      copy:
        dest: /etc/myapp_config.ini
        content: "db_host=db-server"
